<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wild Explorer Certificate Generator</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(135deg,#e9f9df,#f5e6ff);color:#372518}.wrap{max-width:1100px;margin:auto;padding:22px 15px 38px;text-align:center}h1{font-size:clamp(24px,4vw,36px);margin:6px 0}p{margin:6px 0 20px}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}input{font:inherit;font-size:18px;border:3px solid #9c7436;border-radius:14px;padding:13px 17px;min-width:min(90vw,330px);background:#fffdf5}button{font:inherit;font-size:17px;font-weight:bold;padding:14px 20px;border:0;border-radius:14px;background:#257a48;color:white;cursor:pointer;box-shadow:0 4px 0 #17502f}button:active{transform:translateY(3px);box-shadow:0 1px 0 #17502f}.preview{overflow:hidden;border-radius:15px;box-shadow:0 10px 32px #2d381c3d;background:#f7d7a2}canvas{display:block;width:100%;height:auto}.hint{font-size:13px;margin-top:14px;color:#5d574d}</style></head><body><main class="wrap"><h1>🌿 Your Wild Explorer Certificate 🏆</h1><p>Type your name to receive your adventure certificate!</p><div class="controls"><input id="student" type="text" maxlength="50" placeholder="Enter your full name" aria-label="Student name" autocomplete="name"><button id="download">⬇ Download Certificate</button></div><div class="preview"><canvas id="certificate" width="1536" height="864" aria-label="Certificate preview"></canvas></div><div class="hint">Your name is added on your device. No information is uploaded.</div></main><script>const canvas=document.getElementById('certificate'),ctx=canvas.getContext('2d'),input=document.getElementById('student'),img=new Image();img.src='certificate.jpg';img.onload=draw;input.addEventListener('input',draw);function draw(){ctx.clearRect(0,0,1536,864);if(img.complete&&img.naturalWidth)ctx.drawImage(img,0,0,1536,864);const name=input.value.trim();if(!name)return;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';let size=66;ctx.font=`bold ${size}px Georgia,serif`;while(ctx.measureText(name).width>700&&size>22){size-=2;ctx.font=`bold ${size}px Georgia,serif`;}ctx.fillStyle='#44210d';ctx.shadowColor='rgba(255,248,220,.85)';ctx.shadowBlur=6;ctx.fillText(name,855,430);ctx.restore();}document.getElementById('download').addEventListener('click',()=>{if(!input.value.trim()){alert('Please enter your name first!');input.focus();return;}draw();canvas.toBlob(blob=>{if(!blob)return;const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='Wild-Explorer-Certificate-'+input.value.trim().replace(/[^a-z0-9 -]/gi,'').replace(/\s+/g,'-')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png')});</script></body></html>
